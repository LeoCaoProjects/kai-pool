<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Set Location</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#98b5a3",
                        "on-secondary-fixed": "#0b1f18",
                        "secondary-fixed-dim": "#b5ccc1",
                        "surface-container-low": "#f7f3ea",
                        "on-secondary-fixed-variant": "#374b43",
                        "secondary-fixed": "#d1e8dd",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#b0cdbb",
                        "primary-container": "#2d4739",
                        "primary-fixed-dim": "#b0cdbb",
                        "surface-bright": "#fdf9f0",
                        "on-surface": "#1c1c16",
                        "surface-variant": "#e6e2d9",
                        "tertiary": "#4c1e00",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#753403",
                        "surface-container": "#f2ede4",
                        "surface-tint": "#496455",
                        "secondary": "#4e635a",
                        "surface-dim": "#dedad1",
                        "on-secondary": "#ffffff",
                        "background": "#fdf9f0",
                        "primary": "#173124",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#f49760",
                        "tertiary-container": "#6e2f00",
                        "tertiary-fixed-dim": "#ffb68e",
                        "surface-container-highest": "#e6e2d9",
                        "on-tertiary-fixed": "#331200",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#52675e",
                        "inverse-on-surface": "#f5f0e7",
                        "outline-variant": "#c2c8c2",
                        "tertiary-fixed": "#ffdbc9",
                        "surface-container-high": "#ece8df",
                        "outline": "#727973",
                        "on-primary-fixed-variant": "#324c3e",
                        "on-surface-variant": "#424844",
                        "surface": "#fdf9f0",
                        "on-primary-fixed": "#062014",
                        "primary-fixed": "#ccead6",
                        "secondary-container": "#cee5da",
                        "on-error": "#ffffff",
                        "on-background": "#1c1c16",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#32302a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "xs": "4px",
                        "lg": "24px",
                        "xxl": "48px",
                        "base": "8px",
                        "md": "16px",
                        "margin-desktop": "40px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "title-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"],
                        "button": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "button": ["15px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #fdf9f0; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        /* Subtle pulsing effect for the map pin to suggest 'finding location' */
        @keyframes subtlePulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pulse-pin {
            animation: subtlePulse 3s ease-in-out infinite;
        }

        /* Ambient background floating shapes to feel organic and warm */
        .ambient-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            z-index: 0;
            animation: float 20s ease-in-out infinite alternate;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.1); }
        }
    </style>
</head>
<body class="text-on-background font-body-lg min-h-screen flex flex-col relative overflow-hidden">
<!-- Ambient Background -->
<div class="ambient-shape bg-primary-fixed-dim w-[40vw] h-[40vw] top-[-10vw] right-[-10vw]"></div>
<div class="ambient-shape bg-secondary-fixed w-[50vw] h-[50vw] bottom-[-15vw] left-[-15vw]" style="animation-delay: -5s;"></div>
<!-- Top Navigation (Transactional/Onboarding so using simplified header) -->
<header class="w-full h-16 px-margin-mobile flex justify-start items-center z-50 relative bg-transparent">
<button class="text-on-surface hover:bg-surface-container-low p-2 rounded-full transition-colors flex items-center justify-center"><span class="material-symbols-outlined">arrow_back</span></button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop z-10 relative w-full max-w-2xl mx-auto pb-xxl">
<!-- Illustration / Graphic Area -->
<div class="mb-xl relative flex justify-center items-center w-full max-w-[280px] aspect-square"><div class="absolute inset-0 bg-surface-container rounded-full shadow-[inset_0_2px_10px_rgba(0,0,0,0.02)]"></div>
<div class="relative w-3/4 h-3/4 rounded-full flex items-center justify-center bg-primary-container/10 border-4 border-surface shadow-sm">
<span class="material-symbols-outlined text-primary-container text-[80px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div></div>
<!-- Typography Context -->
<div class="text-center mb-xxl w-full">
<h1 class="font-display-lg-mobile md:font-display-lg text-on-surface mb-md font-bold">
                Find your community
            </h1>
<p class="font-body-lg text-on-surface-variant max-w-[400px] mx-auto">
                Your approximate location helps us find food and cooking partners nearby. We only use your general neighborhood.
            </p>
</div>
<!-- Call to Action Container -->
<div class="w-full max-w-[320px] flex flex-col gap-lg items-center">
<button class="w-full bg-primary-container text-on-primary font-button h-14 rounded-lg flex items-center justify-center gap-2 hover:bg-primary transition-all active:scale-[0.98] shadow-sm">
<span class="material-symbols-outlined text-[20px]">my_location</span>
                Enable location
            </button>
<button class="w-full bg-transparent text-on-surface-variant font-button h-14 rounded-full flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-[0.98]">
                Skip for now
            </button>
</div>
<!-- Privacy microcopy -->
<div class="mt-lg flex items-center justify-center gap-2 text-on-surface-variant/70">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="font-label-md">Your precise location is never shared</span>
</div>
</main>


</body></html>
