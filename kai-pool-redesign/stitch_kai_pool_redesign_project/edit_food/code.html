        body {
            background-color: #FAF9F6;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="h-full bg-background text-on-background antialiased flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="flex justify-between items-center h-16 px-margin-mobile w-full z-50 bg-surface dark:bg-surface-dim docked full-width top-0 border-b border-outline-variant dark:border-outline flat no shadows shrink-0">
<button aria-label="Back" class="w-12 h-12 flex items-center justify-center -ml-3 text-on-surface hover:bg-surface-container dark:hover:bg-surface-container-high rounded-full transition-colors duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary dark:text-primary-fixed">Edit Food</h1>
<div class="w-12 h-12"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto w-full max-w-3xl mx-auto pb-24 md:pb-lg">
<!-- Image Header section -->
<div class="w-full relative h-64 bg-surface-container-highest group">
<img class="w-full h-full object-cover" data-alt="A close up, high quality, well lit photograph of fresh Taro root on a minimalist white ceramic plate, resting on a light wooden table. The lighting is soft and natural, emphasizing the organic texture of the taro skin and the clean, community-focused aesthetic of the Kai Pool app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCPmJ8--l5ZrLlUieQWReaPJg1hwTRlmodmfsciR_qi6qTqVJ62Wm-aeeh4TCCASFHg68jQxoepvZs0OmUP1KPwDPIzGpVFNRTqJaOT05Fx2UUxcvbkE4iTOvQAEIV93ATvG07uQqGvIaYlCitdyJjMBbKSkk3Uq_AXcXWdU0dZvX9Cgqt8xluKZ_9swiFPgYQEMr4pBGRu8KUFSKhWKsAyivfrEfgXdyLIrvY8kpwgu345i0JrPYA">
<button class="absolute bottom-md right-md bg-surface text-on-surface px-4 py-2 flex items-center gap-2 shadow-sm font-button text-button hover:bg-surface-container transition-colors rounded-lg">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
                 Change Photo
             </button>
</div>
<div class="p-margin-mobile md:p-margin-desktop max-w-xl mx-auto flex flex-col gap-xl">
<!-- Food Details Form -->
<section class="flex flex-col gap-lg">
<!-- Title Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="food-title">Food Name</label>
<input class="w-full h-14 px-md bg-surface rounded-lg border border-outline-variant focus:border-2 focus:border-primary focus:outline-none focus:ring-0 font-body-lg text-body-lg text-on-surface transition-all placeholder:text-outline" id="food-title" placeholder="What are you sharing?" type="text" value="Fresh Taro Root">
</div>
<!-- Category & Quantity Row -->
<div class="grid grid-cols-2 gap-gutter">
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="food-category">Category</label>
<div class="relative">
<select class="w-full h-14 px-md bg-surface rounded-lg border border-outline-variant focus:border-2 focus:border-primary focus:outline-none focus:ring-0 font-body-lg text-body-lg text-on-surface appearance-none transition-all" id="food-category">
<option selected="" value="produce">Produce</option>
<option value="pantry">Pantry</option>
<option value="baked">Baked Goods</option>
<option value="meals">Prepared Meals</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="food-quantity">Quantity / Unit</label>
<input class="w-full h-14 px-md bg-surface rounded-lg border border-outline-variant focus:border-2 focus:border-primary focus:outline-none focus:ring-0 font-body-lg text-body-lg text-on-surface transition-all" id="food-quantity" placeholder="e.g. 3 apples, 500g" type="text" value="2 kg">
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="food-description">Description &amp; Details</label>
<textarea class="w-full p-md bg-surface rounded-lg border border-outline-variant focus:border-2 focus:border-primary focus:outline-none focus:ring-0 font-body-lg text-body-lg text-on-surface transition-all resize-none" id="food-description" placeholder="Add details like harvest date, ripeness, or specific pickup instructions..." rows="4">Harvested yesterday from my garden. Very fresh and firm. Needs to be cooked thoroughly before eating.</textarea>
</div>
<!-- Use By Date -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="food-expiry">Best Before (Optional)</label>
<div class="relative">
<input class="w-full h-14 px-md bg-surface rounded-lg border border-outline-variant focus:border-2 focus:border-primary focus:outline-none focus:ring-0 font-body-lg text-body-lg text-on-surface transition-all" id="food-expiry" type="date" value="2023-11-15">
</div>
</div>
</section>
<hr class="border-outline-variant/50">
<!-- Location & Pickup Settings -->
<section class="flex flex-col gap-md">
<h2 class="font-title-lg text-title-lg text-on-surface">Pickup Details</h2>
<!-- Location toggle -->
<div class="flex items-center justify-between p-md bg-surface border border-outline-variant rounded-lg">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined">location_on</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface">Default Pickup Location</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">123 Tui Street, Auckland</p>
</div>
</div>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value="">
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Contactless toggle -->
<div class="flex items-center justify-between p-md bg-surface border border-outline-variant rounded-lg">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined">meeting_room</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface">Contactless Pickup</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Leave item at the door</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value="">
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</section>
<!-- Actions -->
<section class="flex flex-col gap-md mt-lg pb-xl md:pb-0">
<button class="w-full h-14 bg-primary text-on-primary font-button text-button flex items-center justify-center transition-transform active:scale-[0.98] shadow-sm rounded-lg">
                    Save changes
                </button>
<button class="w-full h-14 bg-transparent text-error border border-error font-button text-button flex items-center justify-center transition-colors hover:bg-error-container active:scale-[0.98] rounded-lg">
<span class="material-symbols-outlined mr-2">delete</span>
                    Delete ingredient
                </button>
</section>
</div>
</main>
<!-- Suppressed Nav Shell as this is a focused task/edit screen -->


</body></html>
