<style>
        /* Custom Radio Button Styles */
        input[type="radio"] {
            -webkit-appearance: none;
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 2px solid #727973; /* outline */
            border-radius: 50%;
            display: grid;
            place-content: center;
        }

        input[type="radio"]::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #173124; /* primary */
        }

        input[type="radio"]:checked::before {
            transform: scale(1);
        }

        input[type="radio"]:checked {
            border-color: #173124; /* primary */
        }
        
        /* Focus state for accessibility */
        input[type="radio"]:focus-visible {
             outline: max(2px, 0.15em) solid #173124;
             outline-offset: max(2px, 0.15em);
        }

        .option-card {
            transition: all 0.2s ease-in-out;
        }
        .option-card.selected {
            border-color: #173124;
            background-color: #ccead6; /* primary-fixed */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-4">
<!-- Modal Container -->
<div class="rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] w-full max-w-md border border-surface-variant overflow-hidden flex flex-col bg-surface-container-low">
<!-- Header -->
<div class="px-lg pt-lg pb-md flex justify-between items-center border-b border-surface-variant">
<h1 class="font-headline-md text-headline-md text-on-surface font-bold">Share Availability</h1>
<button aria-label="Close" class="p-2 rounded-full hover:bg-surface-container transition-colors duration-200 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<!-- Content -->
<div class="p-lg flex-1 overflow-y-auto">
<p class="font-body-lg text-body-lg text-on-surface-variant mb-lg">
                How would you like to share this food with the community?
            </p>
<div class="space-y-md">
<!-- Option 1: Private -->
<label class="option-card flex items-start gap-md p-md rounded-lg border border-surface-variant cursor-pointer hover:bg-surface-container-low selected bg-primary-fixed border-primary" onkeypress="handleKeyPress(event, this)" tabindex="0">
<div class="mt-1">
<input class="peer" name="availability" onclick="updateSelection(this)" type="radio" value="private">
</div>
<div class="flex-1">
<h3 class="font-title-lg text-title-lg text-on-surface mb-xs flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-weight="fill">lock</span>
                            Private
                        </h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                            Keep this hidden for now. Only you can see and manage this item.
                        </p>
</div>
</label>
<!-- Option 2: Cook Together -->
<label class="option-card flex items-start gap-md p-md rounded-lg border border-surface-variant cursor-pointer hover:bg-surface-container-low" onkeypress="handleKeyPress(event, this)" tabindex="0">
<div class="mt-1">
<input class="peer" name="availability" onclick="updateSelection(this)" type="radio" value="cook_together">
</div>
<div class="flex-1">
<h3 class="font-title-lg text-title-lg text-on-surface mb-xs flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-weight="fill">group</span>
                            Cook Together
                        </h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                            Invite neighbors to join you in preparing a meal using this item.
                        </p>
</div>
</label>
<!-- Option 3: Giveaway -->
<label class="option-card flex items-start gap-md p-md rounded-lg border border-surface-variant cursor-pointer hover:bg-surface-container-low" onkeypress="handleKeyPress(event, this)" tabindex="0">
<div class="mt-1">
<input class="peer" name="availability" onclick="updateSelection(this)" type="radio" value="giveaway">
</div>
<div class="flex-1">
<h3 class="font-title-lg text-title-lg text-on-surface mb-xs flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-weight="fill">redeem</span>
                            Giveaway
                        </h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                            Offer this item for free to anyone in the community who needs it.
                        </p>
</div>
</label>
</div>
</div>
<!-- Footer -->
<div class="p-lg border-t border-surface-variant bg-surface-container-lowest">
<button class="w-full bg-primary text-on-primary font-button text-button py-3 px-4 hover:opacity-90 transition-opacity flex justify-center items-center rounded-lg">
                Confirm Selection
            </button>
</div>
</div>
<script>
        function updateSelection(radioInput) {
            // Remove selected class from all cards
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected');
                card.classList.remove('bg-primary-fixed');
                card.classList.remove('border-primary');
            });

            // Add selected class to the parent card of the checked radio
            if (radioInput.checked) {
                const parentCard = radioInput.closest('.option-card');
                parentCard.classList.add('selected');
                parentCard.classList.add('bg-primary-fixed');
                parentCard.classList.add('border-primary');
            }
        }

        // Allow selection via keyboard (Enter or Space) on the label
        function handleKeyPress(e, labelElement) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                const radio = labelElement.querySelector('input[type="radio"]');
                radio.checked = true;
                updateSelection(radio);
            }
        }
        
        // Initialize state (select first option by default for demonstration)
        document.addEventListener('DOMContentLoaded', () => {
           const firstOption = document.querySelector('input[type="radio"]');
           if(firstOption) {
               firstOption.checked = true;
               updateSelection(firstOption);
           }
        });
    </script>
