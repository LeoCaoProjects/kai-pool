<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Kai Pool - Add Food</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-container": "#98b5a3",
                    "on-secondary-fixed": "#0b1f18",
                    "secondary-fixed-dim": "#b5ccc1",
                    "surface-container-low": "#f7f3ea",
                    "on-secondary-fixed-variant": "#374b43",
                    "secondary-fixed": "#d1e8dd",
                    "error-container": "#ffdad6",
                    "inverse-primary": "#b0cdbb",
                    "primary-container": "#2d4739",
                    "primary-fixed-dim": "#b0cdbb",
                    "surface-bright": "#fdf9f0",
                    "on-surface": "#1c1c16",
                    "surface-variant": "#e6e2d9",
                    "tertiary": "#4c1e00",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#753403",
                    "surface-container": "#f2ede4",
                    "surface-tint": "#496455",
                    "secondary": "#4e635a",
                    "surface-dim": "#dedad1",
                    "on-secondary": "#ffffff",
                    "background": "#fdf9f0",
                    "primary": "#173124",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-container": "#f49760",
                    "tertiary-container": "#6e2f00",
                    "tertiary-fixed-dim": "#ffb68e",
                    "surface-container-highest": "#e6e2d9",
                    "on-tertiary-fixed": "#331200",
                    "on-tertiary": "#ffffff",
                    "on-secondary-container": "#52675e",
                    "inverse-on-surface": "#f5f0e7",
                    "outline-variant": "#c2c8c2",
                    "tertiary-fixed": "#ffdbc9",
                    "surface-container-high": "#ece8df",
                    "outline": "#727973",
                    "on-primary-fixed-variant": "#324c3e",
                    "on-surface-variant": "#424844",
                    "surface": "#fdf9f0",
                    "on-primary-fixed": "#062014",
                    "primary-fixed": "#ccead6",
                    "secondary-container": "#cee5da",
                    "on-error": "#ffffff",
                    "on-background": "#1c1c16",
                    "error": "#ba1a1a",
                    "on-error-container": "#93000a",
                    "inverse-surface": "#32302a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "32px",
                    "xs": "4px",
                    "lg": "24px",
                    "xxl": "48px",
                    "base": "8px",
                    "md": "16px",
                    "margin-desktop": "40px",
                    "gutter": "16px",
                    "margin-mobile": "20px",
                    "sm": "8px"
            },
            "fontFamily": {
                    "title-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "display-lg-mobile": ["Inter"],
                    "body-sm": ["Inter"],

                    "body-lg": ["Inter"]
            },

                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "display-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600"}],

                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]

          }
        }
      }

<style type="text/tailwindcss">
        @layer utilities {
            .material-symbols-outlined {
                font-family: 'Material Symbols Outlined';
                font-weight: normal;
                font-style: normal;
                font-size: 24px;
                line-height: 1;
                letter-spacing: normal;
                text-transform: none;
                display: inline-block;
                white-space: nowrap;
                word-wrap: normal;
                direction: ltr;
                font-feature-settings: 'liga';
                -webkit-font-smoothing: antialiased;
            }
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="docked full-width top-0 border-b border-outline-variant bg-surface transition-colors duration-200 sticky z-50">
<div class="flex justify-between items-center h-16 px-margin-mobile w-full">
<button class="text-primary hover:bg-surface-container rounded-full p-2 -ml-2 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg font-bold text-primary">Kai Pool</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-lg pb-xxl">
<div class="max-w-md mx-auto w-full space-y-xl">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm">Add Food</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Share your extra ingredients with the neighborhood.</p>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Photo Upload Section -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface">Photo</label>
<div class="border border-dashed border-outline-variant rounded-xl bg-surface-container-low h-40 flex flex-col items-center justify-center hover:border-primary hover:bg-surface-container transition-all cursor-pointer">
<div class="bg-surface rounded-full p-3 mb-2 shadow-sm border border-surface-variant">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Tap to upload or take a photo</span>
</div>
</div>
<!-- Name Input -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface" for="foodName">Ingredient Name</label>
<input class="w-full rounded-lg border border-outline-variant bg-surface px-md py-3 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow placeholder-outline" id="foodName" placeholder="e.g., Homegrown Tomatoes" type="text">
</div>
<!-- Quantity Picker -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface">Quantity</label>
<div class="flex items-center space-x-md">
<button aria-label="Decrease quantity" class="w-12 h-12 rounded-full border border-outline-variant bg-surface flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined">remove</span>
</button>
<div class="flex-grow flex items-center">
<input class="w-full text-center rounded-lg border border-outline-variant bg-surface px-md py-3 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow" min="1" type="number" value="1">
</div>
<div class="w-1/3">
<select class="w-full rounded-lg border border-outline-variant bg-surface px-md py-3 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow appearance-none">
<option>kg</option>
<option>items</option>
<option>bunches</option>
<option>liters</option>
</select>
</div>
<button aria-label="Increase quantity" class="w-12 h-12 rounded-full border border-outline-variant bg-surface flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Availability Selector (Segmented Control style) -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface">Availability Intent</label>
<div class="bg-surface-variant p-1 rounded-xl flex space-x-1 relative">
<!-- Active Background Slider (requires JS for full functionality, static styling here) -->
<div class="absolute inset-y-1 left-1 w-[calc(33.333%-2px)] bg-surface rounded-lg shadow-sm z-0"></div>
<button class="flex-1 py-2 px-1 relative z-10 font-label-md text-label-md text-on-surface text-center flex flex-col items-center" type="button">
<span class="material-symbols-outlined mb-1 text-primary" style="font-size: 20px;">visibility_off</span>
                            Private
                        </button>
<button class="flex-1 py-2 px-1 relative z-10 font-label-md text-label-md text-on-surface-variant text-center flex flex-col items-center hover:text-on-surface" type="button">
<span class="material-symbols-outlined mb-1" style="font-size: 20px;">restaurant</span>
                            Cook Together
                        </button>
<button class="flex-1 py-2 px-1 relative z-10 font-label-md text-label-md text-on-surface-variant text-center flex flex-col items-center hover:text-on-surface" type="button">
<span class="material-symbols-outlined mb-1" style="font-size: 20px;">volunteer_activism</span>
                            Giveaway
                        </button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Visible only to you until you choose to share.</p>
</div>
<!-- Submit Button -->
<div class="pt-md">
<button class="w-full bg-primary-container text-on-primary rounded-lg py-4 px-lg font-button text-button flex items-center justify-center hover:bg-primary active:scale-[0.98] transition-transform" type="submit"><span class="material-symbols-outlined mr-2" style="font-variation-settings: 'FILL' 1;">add_circle</span>Add to Pool</button>
</div>
</form>
</div>
</main>
<!-- Bottom Navigation Shell suppressed because this is a transactional "add" screen -->


</body></html>
