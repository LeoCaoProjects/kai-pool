<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Top App Bar (Modified for transactional screen - minimal) -->
<header class="fixed top-0 w-full max-w-[1200px] flex justify-between items-center h-16 px-margin-mobile z-50 bg-surface dark:bg-surface-dim">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container rounded-full transition-colors duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-title-lg text-title-lg font-bold text-primary dark:text-primary-fixed">Kai Pool</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="w-full max-w-md rounded-xl border border-surface-variant p-xl shadow-sm mt-16 bg-surface">
<div class="text-center mb-xl">
<h1 class="font-headline-md text-headline-md text-on-surface mb-base font-bold">Join the Community</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Create an account to start sharing food.</p>
</div>
<form class="space-y-lg flex flex-col">
<!-- Name Input -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">person</span>
<input class="w-full h-[48px] pl-10 pr-md py-base bg-surface border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/60 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" id="name" name="name" placeholder="e.g. Jane Doe" type="text">
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">mail</span>
<input class="w-full h-[48px] pl-10 pr-md py-base bg-surface border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/60 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" id="email" name="email" placeholder="hello@example.com" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">lock</span>
<input class="w-full h-[48px] pl-10 pr-md py-base bg-surface border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/60 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" id="password" name="password" placeholder="••••••••" type="password">
</div>
</div>
<div class="pt-base">
<button class="w-full h-[48px] text-on-primary font-button text-button rounded-lg hover:bg-primary/90 transition-colors flex items-center justify-center shadow-sm bg-primary-container" type="submit">
                    Create account
                </button>
</div>
</form>
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-semibold hover:underline" href="#">Log in</a>
</p>
</div>
</main>
<!-- Bottom Navigation Suppressed as this is a transactional screen -->
