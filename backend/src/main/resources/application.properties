spring.application.name=${SPRING_APPLICATION_NAME:kai-pool-backend}
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=${SERVER_PORT:8080}
spring.profiles.default=database
spring.profiles.group.dev=database
management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET:kai-pool-local-development-secret-change-me}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.6-flash}
app.ai.recipe-model=${GEMINI_RECIPE_MODEL:gemini-3.5-flash-lite}
app.matching.max-distance-km=${MATCHING_MAX_DISTANCE_KM:30}
app.marketplace.max-distance-km=${MARKETPLACE_MAX_DISTANCE_KM:30}
app.meal-images.themealdb.enabled=${THEMEALDB_ENABLED:true}
app.meal-images.themealdb.api-key=${THEMEALDB_API_KEY:1}
app.meal-images.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
app.meal-images.cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
app.meal-images.cloudflare.model=${CLOUDFLARE_IMAGE_MODEL:@cf/black-forest-labs/flux-1-schnell}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
