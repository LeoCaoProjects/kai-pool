spring.application.name=${SPRING_APPLICATION_NAME:kai-pool-backend}
server.port=${SERVER_PORT:8080}
spring.profiles.default=database
spring.profiles.group.dev=database
management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET:kai-pool-local-development-secret-change-me}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
